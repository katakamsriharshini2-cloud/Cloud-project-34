apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voting-app
  template:
    metadata:
      labels:
        app: voting-app
    spec:
      containers:
        - name: voting-app
          image: voting-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_PATH
              value: /data/votes.db
          volumeMounts:
            - name: voting-storage
              mountPath: /data
      volumes:
        - name: voting-storage
          persistentVolumeClaim:
            claimName: voting-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: voting-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: voting-service
spec:
  type: NodePort
  selector:
    app: voting-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080